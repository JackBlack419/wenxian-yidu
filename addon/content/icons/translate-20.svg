<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 96 96">
  <title>文献译读 翻译</title>
  <!--
    侧边导航（sidenav）图标（registerTranslateUI sidenav.icon，浅色宿主）。
    2026-10-09 二次修订：品牌圆盘 T 标更像 logo 而不像翻译功能，改为通用的
    「文 / A 互换」母题——对角的「文」与「A」即两种语言，两支绯红互换箭头
    即翻译动作。配色仍是品牌三色：墨 #1a1a1a = 原文，绯红 #b5343a =
    翻译/互换（与 logo.svg「绯红 = 译文层」同义）。几何与 translate.svg
    完全一致，仅随视框缩放到 20px。深色宿主用 translate-20-dark.svg
    （registerSection sidenav.darkIcon）。显式配色说明见 QA S7。
  -->
