<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 96 96">
  <title>文献译读 翻译</title>
  <!--
    条目面板 section header 图标（registerTranslateUI header.icon，浅色宿主）。
    2026-10-09 二次修订：品牌圆盘 T 标更像 logo 而不像翻译功能，改为通用的
    「文 / A 互换」母题——对角的「文」与「A」即两种语言，两支绯红互换箭头
    即翻译动作（沿用旧图标的互换箭头元素）。配色仍是品牌三色：墨 #1a1a1a =
    原文，绯红 #b5343a = 翻译/互换（与 logo.svg「绯红 = 译文层」同义）。
    深色宿主用 translate-dark.svg（registerSection header.darkIcon），几何
    与本文件完全一致。显式配色说明见 QA S7（显式配色 + 配对 -dark 变体）。

    几何（96 视框，笔画等粗 9、圆角端）：
      文（墨）：点 M28 10 L32 16；横 M14 28 H46；撇 M30 28 L16 52；
                捺 M30 28 L44 52
      A（墨）：斜边 M54 82 L68 44 与 M82 82 L68 44；横 M60 68 H76
      箭头（绯红）：↘ M62 14 L78 30（端头 M78 30 L69 30 / M78 30 L78 21）；
                    ↖ M34 82 L18 66（端头 M18 66 L27 66 / M18 66 L18 75）
  -->
  <g fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 10 L32 16"/>
    <path d="M14 28 H46"/>
    <path d="M30 28 L16 52"/>
    <path d="M30 28 L44 52"/>
    <path d="M54 82 L68 44"/>
    <path d="M82 82 L68 44"/>
    <path d="M60 68 H76"/>
  </g>
  <g fill="none" stroke="#b5343a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M62 14 L78 30"/>
    <path d="M78 30 L69 30"/>
    <path d="M78 30 L78 21"/>
    <path d="M34 82 L18 66"/>
    <path d="M18 66 L27 66"/>
    <path d="M18 66 L18 75"/>
  </g>
</svg>
